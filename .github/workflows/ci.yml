name: CI (P28)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check metis/backend/app

  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi uvicorn sqlalchemy pandas pyarrow httpx pydantic openpyxl pyreadstat netCDF4 pyshp pycountry playwright pytest pyyaml pytest-timeout
      - name: Generate test fixtures (large files, ~2min)
        run: python scripts/gen_fixtures.py
      - name: Install chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests (headless, per-test 180s timeout, verbose)
        env:
          METIS_BROWSER_HEADLESS: "true"
        run: python -u -m pytest metis/backend/tests -v --tb=short -m "not smoke" --timeout=180 --ignore=metis/backend/tests/test_p16_recovery_perf.py

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi uvicorn sqlalchemy pandas pyarrow httpx pydantic openpyxl pyreadstat netCDF4 pyshp pycountry playwright pytest pytest-timeout psutil
      - name: Generate test fixtures
        run: python scripts/gen_fixtures.py
      - name: Run performance + recovery tests
        env:
          METIS_BROWSER_HEADLESS: "true"
        run: python -u -m pytest metis/backend/tests/test_p16_recovery_perf.py -v --tb=short --timeout=600

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/secrets_scan.py

  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: node --check metis/frontend/static/app.js
      - name: HTML contains app shell
        run: grep -q "Metis Data" metis/frontend/static/index.html

  real-provider-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn sqlalchemy pandas pyarrow httpx pydantic openpyxl pyreadstat netCDF4 pyshp pycountry pytest
      - run: python scripts/provider_smoke.py --search-only
