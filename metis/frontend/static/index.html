<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Metis Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/styles.css">
<script type="module" src="/ui/js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Metis Data</div>
    <div class="top-actions">
      <span id="system-status" class="status-dot" title="连接状态"></span>
      <button id="new-conversation" class="icon-btn" title="新会话" aria-label="新会话">＋ 新会话</button>
      <button id="settings-button" class="icon-btn" aria-label="设置">⚙</button>
    </div>
  </header>
  <main class="workspace">
    <section id="chat-pane" class="chat-pane">
      <div id="conversation">
        <div class="empty-state">
          <div class="empty-title">Metis Data</div>
          <div class="empty-sub">告诉我你需要什么数据。我会自己寻找、获取、整理，并把结果放在右侧。</div>
          <div class="suggestions">
            <button class="suggestion" data-q="找跨国青年失业率数据">找跨国青年失业率数据</button>
            <button class="suggestion" data-q="找中国城市层面的财政和产业数据">找中国城市层面的财政和产业数据</button>
            <button class="suggestion" data-q="找一篇论文背后的公开数据">找一篇论文背后的公开数据</button>
          </div>
        </div>
      </div>
      <div id="task-status" class="hidden"></div>
      <form id="composer">
        <textarea id="chat-input" rows="1" placeholder="输入你的数据需求…" aria-label="数据需求"></textarea>
        <button id="btn-send" type="submit" aria-label="发送" disabled>→</button>
      </form>
    </section>
    <section id="result-pane" class="result-pane">
      <div id="result-header" class="result-header"><span>找到的数据会显示在这里</span></div>
      <div id="result-list"></div>
      <div id="result-preview" class="hidden"></div>
    </section>
  </main>
  <div id="modal-root"></div>
</div>
</body>
</html>
