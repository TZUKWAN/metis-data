<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Metis Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<header>
  <div class="brand">Metis Data <span class="sub">数据智能体 · 发现 → 获取 → 合成 → 可复现交付</span></div>
  <div id="conn-status" class="conn">连接中…</div>
</header>
<main class="grid">
  <!-- LEFT: task / data -->
  <section class="col left">
    <div class="panel">
      <h3>数据需求</h3>
      <textarea id="req-text" rows="4" placeholder="例：构建 2015—2023 年国家层面的青年失业率、人均 GDP、教育水平面板，优先使用官方或国际组织数据。"></textarea>
      <button id="btn-parse" class="primary">解析需求</button>
      <button id="btn-agent-plan">Agent 深度解析（LLM）</button>
      <div id="req-card" class="hidden"></div>
      <div id="agent-plan-card" class="hidden"></div>
    </div>
    <div class="panel">
      <h3>搜索</h3>
      <label class="row"><input type="checkbox" id="auto-select" checked> 搜索后自动排序候选</label>
      <button id="btn-search" class="primary">并行搜索 Provider</button>
      <button id="btn-cancel-search" class="danger">取消搜索</button>
      <div id="provider-progress"></div>
    </div>
    <div class="panel">
      <h3>候选数据集</h3>
      <div id="candidates"></div>
    </div>
    <div class="panel">
      <h3>下载</h3>
      <button id="btn-refresh-downloads">刷新</button>
      <div id="downloads"></div>
    </div>
    <div class="panel">
      <h3>Build 合成</h3>
      <button id="btn-build-create">从已选候选创建 Build</button>
      <div id="builds"></div>
    </div>
    <div class="panel">
      <h3>Provenance / 交付包</h3>
      <div id="provenance"></div>
    </div>
    <div class="panel">
      <h3>Acquisition Tasks</h3>
      <div id="acq-tasks"><p style="color:var(--dim)">暂无自主采集任务</p></div>
    </div>
    <div class="panel">
      <h3>Backend Health</h3>
      <button id="btn-backend-health">诊断外部后端</button>
      <div id="backend-health"></div>
    </div>
    <div class="panel">
      <h3>Provider Matrix（真实接入等级）</h3>
      <button id="btn-matrix">加载 Integration Matrix</button>
      <div id="provider-matrix"></div>
    </div>
    <div class="panel">
      <h3>Project / Agent Chat</h3>
      <div class="row"><input id="proj-title" placeholder="新项目标题（P24）"></div>
      <div class="row"><button id="btn-project-create" class="primary">创建项目</button></div>
      <div id="projects"></div>
      <div class="row" style="margin-top:6px"><input id="chat-input" placeholder="问 Agent：现在进行到哪了 / 为什么推荐… / 怎么合成"></div>
      <div class="row"><button id="btn-chat-ask" class="primary">提问</button></div>
      <div id="chat-answer"></div>
    </div>
    <div class="panel">
      <h3>Account Center</h3>
      <div class="row"><select id="ac-provider"></select></div>
      <div class="row"><input id="ac-label" placeholder="账号邮箱/标识"></div>
      <div class="row"><input id="ac-password" type="password" placeholder="密码/Token（不回显）"></div>
      <div class="row">
        <button id="ac-bind">绑定账号</button>
        <button id="ac-login">登录（真实浏览器）</button>
        <button id="ac-delete" class="danger">删除账号</button>
      </div>
      <label class="row"><input type="checkbox" id="ac-auto"> 允许自动注册</label>
      <div id="ac-list"></div>
    </div>
  </section>

  <!-- CENTER: live browser / data -->
  <section class="col center">
    <div class="panel browser">
      <h3>Live Browser
        <span class="btns">
          <button id="bs-new">新会话</button>
          <button id="bs-navigate">导航</button>
          <input id="bs-url" placeholder="https://…">
          <button id="bs-pause">Pause</button>
          <button id="bs-takeover">我来操作</button>
          <button id="bs-return">交还 Agent</button>
        </span>
      </h3>
      <div id="browser-status" class="badge"></div>
      <div style="position:relative">
        <canvas id="browser-shot" width="800" height="500" style="width:100%;background:#000;border:1px solid var(--line);border-radius:6px"></canvas>
      </div>
      <div id="browser-intervention" class="hidden"></div>
      <div id="browser-events"></div>
    </div>
    <div class="panel">
      <h3>Data Preview / Schema</h3>
      <div id="artifact-list"></div>
      <div id="preview"></div>
    </div>
  </section>

  <!-- RIGHT: agent -->
  <section class="col right">
    <div class="panel">
      <h3>Data Agent</h3>
      <div id="agent-events"></div>
    </div>
  </section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
