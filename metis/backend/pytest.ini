[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    unit: fast isolated tests
    integration: cross-module tests with fixtures
    contract: provider adapter contract tests
    e2e: end-to-end tests (fixture browser/server)
    security: vault/redaction/scan tests
    recovery: crash-recovery tests
    performance: benchmark tests
    smoke: live third-party network tests (not run in CI by default)
filterwarnings =
    ignore::DeprecationWarning
